<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-label="Nabiel — Independent AI Developer, Automation Engineer, Technology Builder. Ship log listing quality-house-v4, smt-lab, memo-smt-ea, mimo-vscode and vintage-streetwear.">
